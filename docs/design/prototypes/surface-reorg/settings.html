  about: { title: 'About', lede: 'Version, updates and credits.', sections: [
    { title: 'Agent Friday™ by FutureSpeak.AI™', lede: 'Agent Friday™ and FutureSpeak.AI™ are trademarks of FutureSpeak.AI.', rows: [
      R('about.version', 'Version', '5.14.3, installed 12 days ago.', '', ['', ''], B('Check for updates'), ['what version are you']),
      R('about.updates', 'Check for new versions weekly', 'Asks GitHub once a week whether a newer release exists. Sends nothing about you or this PC.', 'Off, you check by hand. She never downloads or installs on her own either way.', ['you', '12 days ago'], T(false), ['check for updates weekly']),
    ] },
  ] },
};

// ── Render ──
const rail = document.getElementById('rail'), inner = document.getElementById('inner'), hits = document.getElementById('hits');
let current = 'general', changed = {};
for (const g of GROUPS) {
  const gl = document.createElement('div'); gl.className = 'group-label label-caps'; gl.textContent = g.name; rail.appendChild(gl);
  for (const [id, label, ic, tag] of g.pages) {
    const b = document.createElement('button'); b.className = 'pg'; b.dataset.page = id;
    b.innerHTML = icon(ic) + '<span>' + label + '</span>' + (tag ? '<span class="tag">' + tag + '</span>' : '');
    rail.appendChild(b);
  }
}
document.querySelectorAll('.pg').forEach(b => b.addEventListener('click', () => show(b.dataset.page)));

function ctl(row) {
  const c = row.ctl, k = row.key;
  if (c.kind === 'toggle') return '<button class="toggle" role="switch" aria-checked="' + (changed[k] !== undefined ? changed[k] : c.on) + '" aria-label="' + row.label + '" data-key="' + k + '"></button>';
  if (c.kind === 'select') return '<select class="sel" aria-label="' + row.label + '" data-key="' + k + '">' + c.opts.map(o => '<option' + (o === (changed[k] || c.v) ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>';
  if (c.kind === 'seg') return '<div class="seg" role="group" aria-label="' + row.label + '">' + c.opts.map(o => '<button aria-pressed="' + (o === (changed[k] || c.v)) + '" data-key="' + k + '" data-v="' + o + '">' + o + '</button>').join('') + '</div>';
  if (c.kind === 'field') return '<input class="fld" value="' + (changed[k] || c.v) + '" aria-label="' + row.label + '" data-key="' + k + '" style="min-width:' + (c.w || 160) + 'px;width:' + (c.w || 160) + 'px">';
  if (c.kind === 'button') return '<button class="btn ' + (c.cls || '') + '" data-key="' + k + '">' + c.label + '</button>';
  return '';
}
function rowHtml(r) {
  const isDefault = /^default$/i.test(r.prov[0] || '');
  const who = isDefault ? 'Default, never changed' : r.prov[0] ? ('Changed by ' + r.prov[0] + (r.prov[1] ? ' · <span class="mono">' + r.prov[1] + '</span>' : '')) : (r.prov[1] ? '<span class="mono">' + r.prov[1] + '</span>' : '');
  return '<div class="srow" data-key="' + r.key + '" id="row-' + r.key.replace(/\./g, '-') + '">' +
    '<div class="lbl">' + r.label + '</div>' +
    '<div class="meaning">' + r.meaning + '</div>' +
    (r.cons ? '<div class="cons">' + r.cons + '</div>' : '<div></div>') +
    '<div class="prov">' + (who || '<span>Default</span>') + (r.prov[0] && r.prov[0] !== 'default' && r.prov[0] !== 'Default' && r.prov[1] ? ' · <a href="#" data-undo="' + r.key + '">Undo</a>' : '') + (r.phrases.length ? ' · <span title="Say it to Friday">say: “' + r.phrases[0] + '”</span>' : '') + '</div>' +
    '<div class="ctl">' + ctl(r) + '</div></div>';
}
function statHtml(s) {
  const dot = s[2] ? '<span class="sd" style="background:var(--fr-' + (s[2] === 'work' ? 'violet' : s[2]) + ')"></span>' : '';
  return '<div class="stat"><div class="k">' + s[0] + '</div><div class="v">' + dot + s[1] + '</div></div>';
}
function show(id, highlightKey) {
  current = id;
  const p = PAGES[id];
  document.querySelectorAll('.pg').forEach(b => b.setAttribute('aria-current', b.dataset.page === id ? 'true' : 'false'));
  inner.innerHTML = '<header><h1>' + p.title + '</h1><p>' + p.lede + '</p></header>' + p.sections.map(s =>
    '<section class="' + (s.danger ? 'danger' : '') + '"><h2>' + s.title + (s.status ? ' <span class="status-tag">status</span>' : '') + '</h2>' +
    (s.lede ? '<p class="lede">' + s.lede + '</p>' : '') +
    (s.stats ? '<div class="status-grid">' + s.stats.map(statHtml).join('') + '</div>' : '') +
    s.rows.map(rowHtml).join('') + '</section>').join('');
  wire();
  if (highlightKey) {
    const el = document.getElementById('row-' + highlightKey.replace(/\./g, '-'));
    if (el) { el.classList.add('hit'); el.scrollIntoView({ block: 'center' }); const c = el.querySelector('.ctl [data-key]'); c && c.focus(); }
  } else document.getElementById('page').scrollTop = 0;
}
function wire() {
  inner.querySelectorAll('.toggle').forEach(t => t.addEventListener('click', () => {
    const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); changed[t.dataset.key] = on; mark(t.dataset.key);
  }));
  inner.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); changed[b.dataset.key] = b.dataset.v; mark(b.dataset.key);
  }));
  inner.querySelectorAll('select.sel, input.fld').forEach(s => s.addEventListener('change', () => { changed[s.dataset.key] = s.value; mark(s.dataset.key); }));
  inner.querySelectorAll('.btn[data-key]').forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('danger')) toast('Prototype: a destructive action confirms by naming what it destroys.', true);
    else toast('Prototype: “' + b.textContent.replace('…', '') + '” would open here.');
  }));
  inner.querySelectorAll('[data-undo]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); toast('Restored the previous value. Undo holds for thirty days.'); }));
}
function mark(key) {
  const el = document.getElementById('row-' + key.replace(/\./g, '-'));
  const prov = el && el.querySelector('.prov');
  if (prov) prov.innerHTML = 'Changed by you · <span class="mono">just now</span> · <a href="#" data-undo="' + key + '">Undo</a>';
  wire();
  toast('Saved. Changed by you, just now; Undo holds for thirty days.');
}

// ── Search, or say it (HIG §6.3) ──
const q = document.getElementById('q'), say = document.getElementById('say');
const ALL = Object.entries(PAGES).flatMap(([pid, p]) => p.sections.flatMap(s => s.rows.map(r => ({ pid, r }))));
const SENTENCES = [
  { test: /stop reading (my )?work (e-?)?mail after (\d+)/i, build: m => ({ said: 'Stop reading your work mail after ' + m[3] + ':00.', diff: ['- connectors.google_work.read_hours: always', '+ connectors.google_work.read_hours: 07:00 to ' + m[3] + ':00', '- permissions.mode.work.until: (unset)', '+ permissions.mode.work.until: ' + m[3] + ':00'], cons: 'After ' + m[3] + ':00 nothing new arrives from the work account until morning; routines that read it wait. The personal account is unchanged.', page: 'connectors', key: 'connectors.google_work' }) },
  { test: /(go )?off the record/i, build: () => ({ said: 'Go off the record.', diff: ['- privacy.off_record: false', '+ privacy.off_record: true'], cons: 'Nothing is saved from now: no log, no memory, no wiki update, no receipt. Stays on until you turn it off.', page: 'privacy', key: 'privacy.off_record' }) },
  { test: /keep the (local )?brain warm/i, build: () => ({ said: 'Keep the local brain warm.', diff: ['- models.keep_warm: true', '+ models.keep_warm: true (no change)'], cons: 'Already on. It holds about 9 GB of GPU memory while idle.', page: 'models', key: 'models.keep_warm' }) },
  { test: /unload the brain|free the gpu/i, build: () => ({ said: 'Unload the local brain when idle.', diff: ['- models.keep_warm: true', '+ models.keep_warm: false'], cons: 'Frees about 9 GB of GPU memory while idle; the first answer after a pause takes about 40 s.', page: 'models', key: 'models.keep_warm' }) },
  { test: /cap (my )?spending at \$?(\d+)/i, build: m => ({ said: 'Cap spending at $' + m[2] + ' a month.', diff: ['- spending.monthly_stop: $60', '+ spending.monthly_stop: $' + m[2]], cons: 'Cloud calls stop for the month at $' + m[2] + '; local work continues and routines that need the cloud wait.', page: 'spending', key: 'spending.monthly_stop' }) },
];
function search() {
  const v = q.value.trim();
  say.classList.remove('open'); say.innerHTML = '';
  inner.querySelectorAll('.srow.hit').forEach(e => e.classList.remove('hit'));
  if (!v) { hits.textContent = ''; return; }
  const s = SENTENCES.find(x => x.test.test(v));
  if (s) {
    const d = s.build(v.match(s.test));
    hits.textContent = 'A sentence: see the diff';
    say.classList.add('open');
    say.innerHTML = '<div class="q">What I heard</div><div>' + d.said + '</div>' +
      '<div class="diff">' + d.diff.map(l => '<span class="' + (l[0] === '-' ? 'del' : 'add') + '">' + l + '</span>').join('\n') + '</div>' +
      '<div class="dim" style="font-size:var(--fr-text-md)"><b style="color:var(--fr-label)">If you say yes:</b> ' + d.cons + '</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px"><button class="btn ok" id="sayYes">Yes</button><button class="btn" id="sayNo">Change it</button><span class="faint" style="font-size:var(--fr-text-sm);align-self:center">Nothing applies before the yes. A conditional yes becomes a revised diff.</span></div>';
    if (current !== d.page) show(d.page, d.key); else { const el = document.getElementById('row-' + d.key.replace(/\./g, '-')); if (el) { el.classList.add('hit'); el.scrollIntoView({ block: 'center' }); } }
    document.getElementById('sayYes').addEventListener('click', () => { say.classList.remove('open'); toast('Applied. The diff and your yes are the receipt.'); q.value = ''; hits.textContent = ''; });
    document.getElementById('sayNo').addEventListener('click', () => { toast('Prototype: she asks one question back, not a guess.'); });
    return;
  }
  const lv = v.toLowerCase();
  const m = ALL.filter(({ r }) => (r.label + ' ' + r.meaning + ' ' + r.phrases.join(' ')).toLowerCase().includes(lv));
  hits.textContent = m.length ? m.length + ' row' + (m.length === 1 ? '' : 's') + ' · Enter jumps to the first' : 'No row matches; try a sentence';
  if (m.length && m[0].pid === current) m.slice(0, 6).forEach(({ r }) => { const el = document.getElementById('row-' + r.key.replace(/\./g, '-')); el && el.classList.add('hit'); });
  q._first = m[0];
}
q.addEventListener('input', search);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && q._first && !say.classList.contains('open')) show(q._first.pid, q._first.r.key); if (e.key === 'Escape') { q.value = ''; search(); } });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); show('general'); } });

// ── Palette: settings rows are actions too (HIG §8) ──
const pal = installPalette(() => [
  { name: 'Settings', items: ALL.slice(0, 400).map(({ pid, r }) => ({ label: r.label, hint: PAGES[pid].title, icon: 'gear', run: () => show(pid, r.key) })) },
  { name: 'Workspaces', items: [['News'], ['Messages'], ['Calendar'], ['People'], ['Activity'], ['Routines']].map(([w]) => ({ label: 'Open ' + w, icon: w.toLowerCase(), run: () => toast('Prototype: opens ' + w) })) },
  { name: 'Needs you', items: [{ label: 'Approve: send the follow-up to Dana', hint: 'external send', icon: 'check', run: () => toast('Prototype: the card opens in chat and in Activity → Needs you.') }] },
]);
document.getElementById('openPalette').addEventListener('click', pal.open);
document.getElementById('chatBtn').addEventListener('click', () => toast('Prototype: the chat tray docks on the right.'));
document.getElementById('gearBtn').addEventListener('click', () => show('general'));

const want = location.hash.replace('#', '');
show(PAGES[want] ? want : 'general');
</script>
</body>
</html>
