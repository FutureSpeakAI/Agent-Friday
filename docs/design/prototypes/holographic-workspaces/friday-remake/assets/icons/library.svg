<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="lbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="lbgl">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- A straight line has a zero-height box, so a box-relative gradient paints nothing on it:
         its gradient ("u") is in the icon's own coordinates. -->
    <linearGradient id="lbgu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="22" height="22" rx="1.5" stroke="url(#lbg1)" stroke-width="1.2" filter="url(#lbgl)"/>
  <line x1="5" y1="16" x2="27" y2="16" stroke="url(#lbgu)" stroke-width="1" opacity="0.7"/>
  <rect x="8" y="8" width="3" height="8" stroke="url(#lbg1)" stroke-width="1" filter="url(#lbgl)"/>
  <rect x="12.5" y="9.5" width="3" height="6.5" stroke="url(#lbg1)" stroke-width="1" filter="url(#lbgl)"/>
  <rect x="17" y="8" width="3" height="8" stroke="url(#lbg1)" stroke-width="1" filter="url(#lbgl)"/>
  <rect x="8" y="19" width="4" height="8" stroke="url(#lbg1)" stroke-width="1" filter="url(#lbgl)"/>
  <rect x="13.5" y="20.5" width="3" height="6.5" stroke="url(#lbg1)" stroke-width="1" filter="url(#lbgl)"/>
  <circle cx="22.5" cy="22" r="1" fill="#00d4ff" opacity="0.7"/>
</svg>
