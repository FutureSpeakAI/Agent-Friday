version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  # The Windows installer installs from these files, not from pyproject.toml.
  - package-ecosystem: pip
    directory: /packaging/windows/requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      installer-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
