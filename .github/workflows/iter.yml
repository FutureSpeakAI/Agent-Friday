name: iter
# Scratch workflow for the ci/iter branch only: runs the named test files fast.
# Never merged.
on:
  push:
    branches: [ci/iter]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,google,federation,podcast,compose]"
      - run: pytest -n 2 -q -p no:cacheprovider $(cat ci_iter_tests.txt)
