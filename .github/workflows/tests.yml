name: tests

on:
  push:
    branches: [main]
    # A version tag runs the suite on its exact commit; the installer
    # workflow's release gate (scripts/release_gate.py) waits for this run.
    tags: ["v*"]
  pull_request:
    # labeled: adding red-evidence re-runs the PR as the targeted job below.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    # A red-evidence PR proves only that its new tests fail on unchanged code:
    # it runs the red-evidence job instead of the full matrix.
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'red-evidence') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Core dependencies come from pyproject.toml, not a hand-copied list. The
      # heavy optional ML stack (sentence-transformers, chromadb, headroom-ai)
      # is deliberately excluded: the application degrades those to no-ops.
      # The podcast extra (numpy, pandas, num2words) is light and is what the
      # podcast engine, the spreadsheet briefings and the egress gate's
      # embedding layer need; the tests that use them also importorskip.
      # The compose extra (imageio-ffmpeg) bundles the ffmpeg binary the media
      # previews decode audio and video with; the previews tests need it.
      - name: Install agent-friday with the dev extra
        run: pip install -e ".[dev,google,federation,podcast,compose]"

      # The tray and GUI-automation modules import display machinery at module
      # scope and are shipped Windows dependencies; the suite collects them.
      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: pip install -e ".[windows]"

      # Module-level statement order is invisible to the lint set below (the
      # names exist, just later in the file); only executing the import proves it.
      - name: Import smoke test
        run: python scripts/check_imports.py

      - name: Run unit + API suites
        run: pytest tests/unit tests/api -q

      # Runs even when the unit step failed, so the boundary result is always
      # visible; a cancelled run skips it.
      - name: Run security + egress boundary suites
        if: ${{ !cancelled() }}
        run: pytest tests/security tests/test_egress_adversarial.py tests/test_judgment_gate.py -q

      # The workspace / Laya contract: every workspace has a manifest, gate classes
      # agree, and the Laya coverage ratchet never goes down. It lives outside
      # tests/unit, so it ran only when someone remembered to run it.
      - name: Run the workspace and Laya contract test
        if: ${{ !cancelled() }}
        run: pytest tests/test_laya_workspace_contracts.py -q

      # The integration suite: services working together, and on Windows the
      # document engine end to end with the real pinned binary. The binary is
      # put in place by the installer's own code (OfficeCli.ps1: download, size
      # and SHA-256 against the pin, INSTALL.json), so CI proves the same file
      # a person gets. FRIDAY_REQUIRE_OFFICECLI turns the office tests' skip
      # into a failure, so a broken install cannot pass as "skipped".
      # The live residency tests stay opt-in (multi-GB local models).
      - name: Put the pinned document engine where Friday looks for it
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: |
          . packaging\windows\lib\Common.ps1
          . packaging\windows\lib\Download.ps1
          . packaging\windows\lib\OfficeCli.ps1
          if (Get-Command Initialize-Tls -ErrorAction SilentlyContinue) { Initialize-Tls }
          if (-not (Install-OfficeCli)) { $script:Transcript | Select-Object -Last 20; throw 'the pinned OfficeCLI could not be installed' }
          Get-Content (Join-Path $env:USERPROFILE '.friday\runtime\officecli\INSTALL.json')

      - name: Run the integration suite
        if: ${{ !cancelled() }}
        env:
          FRIDAY_REQUIRE_OFFICECLI: ${{ runner.os == 'Windows' && '1' || '' }}
        run: pytest tests/integration -q -rs

  guards:
    name: repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whitespace/conflict-marker step diffs HEAD~1..HEAD. With the
          # default depth of 1 HEAD~1 does not exist and the fallback diffs a
          # clean tree, so the step always passed.
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Fatal-only rule set: syntax errors (E9), invalid comparisons/format
      # strings (F63), forward-reference issues (F7), undefined names (F82).
      - name: ruff (fatal rules)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Gated-prompt callers
        run: python scripts/check_gated_prompt_callers.py
      - name: Settings readers
        run: python scripts/check_settings_readers.py
      - name: Stale model names
        run: python scripts/check_stale_model_names.py
      - name: Governance never reads trust
        run: python scripts/check_trust_in_governance.py
      - name: Model work is visible
        run: python scripts/check_visible_jobs.py
      - name: Brand tokens
        run: python scripts/check_brand_tokens.py
      - name: Markdown links
        run: python scripts/check_doc_links.py
      - name: Secret / PII scan of the whole tracked tree
        run: python .githooks/security_scan.py --tree
      - name: Whitespace and conflict markers
        run: git diff --check HEAD~1 HEAD || git diff --check

  # The app works in a real browser: the Settings walk (every section, every
  # safe control, the change survives a reload) and the See & Touch specs, run
  # against a scratch Friday with its own home and no residency Arbiter
  # (playwright.app.config.ts). A broken Settings control fails this job.
  # seams.spec.ts is left out here: it checks the selected models against live
  # provider catalogues, which a CI runner has no keys or local models for.
  app-specs:
    name: app specs (Settings walk, See & Touch)
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'red-evidence') }}
    # Windows, the platform Friday ships on: the scratch server calls Windows
    # tools (PowerShell) that a Linux runner does not have.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install agent-friday with the dev extra
        run: pip install -e ".[dev,google,federation,podcast]"
      - name: Install the pinned Playwright and its Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the app specs
        env:
          FRIDAY_PYTHON: python
        run: >
          npx playwright test --config=playwright.app.config.ts --workers=1
          --timeout=180000 --output=test-results/app
          settings_walk.spec.ts smoke.spec.ts
          camera_mode.spec.ts
          fill_in_place.spec.ts messages_friday_select.spec.ts open_only_stage.spec.ts
          point_and_chips.spec.ts settings_highlight.spec.ts step_panel.spec.ts
          studio_alias_nav.spec.ts this_and_these.spec.ts calendar_views.spec.ts calendar_move.spec.ts calendar_reminders.spec.ts
          calendar_freebusy.spec.ts calendar_rsvp.spec.ts calendar_delete.spec.ts
          activity_never_collapses.spec.ts connect_services.spec.ts laya_settings.spec.ts
          posting_screens.spec.ts text_size.spec.ts
      # The run's output folder, uploaded on success as well as failure: it holds
      # the Settings walk table, failure traces, and the screenshots specs save
      # for a person to look at (posting_screens.spec.ts: posting-*.png).
      - name: Keep the Settings walk table and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same pin as installer.yml
        with:
          name: app-specs-results
          path: test-results/app
          if-no-files-found: ignore
      # The first-run walk finishes setup, so it runs on its own scratch home
      # (a separate Playwright run starts a separate scratch server). Its
      # screenshots of every setup step are kept for a person to look at.
      - name: Run the first-run walk (its own scratch home)
        if: ${{ !cancelled() }}
        env:
          FRIDAY_PYTHON: python
          FRIDAY_FIRST_RUN_WALK: "1"
        run: >
          npx playwright test --config=playwright.app.config.ts --workers=1
          --timeout=600000 --output=test-results/first-run first_run_setup.spec.ts
      - name: Keep the first-run screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same pin as installer.yml
        with:
          name: first-run-screens
          path: test-results/first-run
          if-no-files-found: ignore

  package:
    name: package build
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'red-evidence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      # The wheel must carry the bundled seed skills' non-code files; a wheel
      # without them installs a career pipeline that cannot work.
      - name: Verify package data
        run: python scripts/check_package_data.py dist/*.whl

  # A PR labelled red-evidence carries only new tests on unchanged code, to show
  # they fail by assertion before the fix. It runs just the test files it changes,
  # once, instead of the whole matrix: the fix PR runs the full suites.
  red-evidence:
    name: red evidence (changed test files)
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'red-evidence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install agent-friday with the dev extra
        run: pip install -e ".[dev,google,federation,podcast,compose]"
      - name: Run the changed test files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'tests/*.py' 'tests/**/*.py' | grep -E '(^|/)test_[^/]*\.py$' || true)
          if [ -z "$files" ]; then
            echo "A red-evidence PR must add or change at least one test file."; exit 1
          fi
          echo "$files"
          pytest $files -q
