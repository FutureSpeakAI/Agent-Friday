name: clean-machine

# The clean-machine matrix (north star §34.3): the setup program installed on
# machines that have never seen Friday, in the situations a release must
# survive beyond the fresh-install job in installer.yml. Every leg runs on a
# fresh GitHub-hosted Windows VM and uninstalls what it installed.
#
#   windows-2022 / windows-2025   two Windows images (§34.3-1)
#   memory-cap     Friday's server and everything it starts capped at
#                  4,096 MiB by a Windows job object; the peak is recorded
#                  (§34.3-2; see MEMORY_CAP_MIB below)
#   locale         a Turkish user locale (dotless i, decimal comma) (§34.3-4)
#   standard-user  a standard, non-administrator account whose name and
#                  profile folder are not plain ASCII (§34.3-5)
#   evidence       one record over every leg, uploaded as an artifact
#                  (scripts/clean_machine_evidence.py) (§34.3-8)
#
# It runs on every version tag (the release gate waits for it), by hand, and
# on pull requests that touch the installer or this matrix. The model page is
# answered with the cloud option, so nothing is downloaded.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/clean-machine.yml"
      - "scripts/clean_machine_evidence.py"

permissions:
  contents: read

concurrency:
  group: clean-machine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What Friday may use on a small machine running cloud-only: the documents
  # name 16 GB only for the local model, and no floor for cloud use, so this
  # leg measures the first boot under a 4 GiB budget and records the peak.
  MEMORY_CAP_MIB: "4096"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Inno Setup is available
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 6 is not installed and could not be installed' }
      - name: Build the setup program
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1 -BuildPython python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: packaging/windows/dist/AgentFriday-Setup-*.exe
          if-no-files-found: error

  leg:
    needs: build
    name: leg (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: windows-2022,  os: windows-2022,   variant: standard }
          - { leg: windows-2025,  os: windows-2025,   variant: standard }
          - { leg: memory-cap,    os: windows-latest, variant: memory-cap }
          - { leg: locale,        os: windows-latest, variant: locale }
          - { leg: standard-user, os: windows-latest, variant: standard-user }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: artifact
      - name: A Turkish user locale (locale leg only)
        if: matrix.variant == 'locale'
        shell: powershell
        run: |
          Set-Culture tr-TR
          Set-WinHomeLocation -GeoId 235
          Set-WinUserLanguageList -LanguageList tr-TR -Force
          (Get-Culture).Name
      - name: Install, first boot, uninstall (${{ matrix.leg }})
        shell: powershell
        run: |
          $exe = (Get-ChildItem artifact\AgentFriday-Setup-*.exe | Select-Object -First 1).FullName
          $work = Join-Path $env:RUNNER_TEMP 'clean-machine'
          if ('${{ matrix.variant }}' -eq 'standard-user') {
            powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\clean-machine\run-as-standard-user.ps1 -Setup $exe -WorkDir $work
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\clean-machine\verify-clean-machine.ps1 `
              -Setup $exe -WorkDir $work -Variant '${{ matrix.variant }}' -MemoryCapMiB ([int]$env:MEMORY_CAP_MIB)
          }
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-machine-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/clean-machine/RESULT.json
            ${{ runner.temp }}/clean-machine/*.log
            ${{ runner.temp }}/clean-machine/*.err
          if-no-files-found: ignore

  evidence:
    needs: leg
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: clean-machine-*
          path: legs
      - name: One evidence record over every leg
        run: python3 scripts/clean_machine_evidence.py --dir legs --sha "${{ github.sha }}" --out evidence/clean-machine-evidence.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-machine-evidence
          path: evidence/clean-machine-evidence.json
          if-no-files-found: error
