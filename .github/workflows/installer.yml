name: installer

# Builds the Windows installer and proves it on machines that have never seen
# Friday: every job below runs on a fresh GitHub-hosted Windows VM.
#
#   build            packaging/windows/build-installer.ps1 -> the setup zip
#   fresh-install    install, start, check first run, uninstall
#                    (packaging/windows/tests/verify-clean-install.ps1)
#   upgrade          install the previous published release, create a vault,
#                    upgrade in place, prove the passphrase and data survive
#                    (packaging/windows/tests/rehearsal/upgrade-vault-test.ps1)
#   draft-release    on a version tag only: a DRAFT GitHub release carrying the
#                    zip, its SHA-256 and RELEASE_NOTES.md. A draft is private
#                    until a maintainer publishes it by hand.
#
# Pushing a tag is the release decision; nothing here publishes anything.

on:
  workflow_dispatch:
    inputs:
      previous:
        description: "Published release to upgrade from (tag)"
        required: false
        default: "v5.13.0"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

env:
  PREVIOUS_RELEASE: ${{ github.event.inputs.previous || 'v5.13.0' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match pyproject version $v" }
      - name: Build the installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1 -BuildPython python
      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem packaging/windows/dist/AgentFriday-Setup-*.zip | Select-Object -First 1
          $h = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($zip.Name)" | Set-Content -Path "$($zip.FullName).sha256" -Encoding ascii
          Get-Content "$($zip.FullName).sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: |
            packaging/windows/dist/AgentFriday-Setup-*.zip
            packaging/windows/dist/AgentFriday-Setup-*.zip.sha256
          if-no-files-found: error

  fresh-install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: artifact
      - name: Install, check first run, uninstall
        shell: powershell
        run: |
          $zip = Get-ChildItem artifact\AgentFriday-Setup-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\verify-clean-install.ps1 -Zip $zip.FullName -WorkDir "$env:RUNNER_TEMP\fresh"
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-install-evidence
          path: ${{ runner.temp }}/fresh/*.json
          if-no-files-found: ignore

  upgrade:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: artifact
      - name: Fetch the previous published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:PREVIOUS_RELEASE -R ${{ github.repository }} -p "AgentFriday-Setup-*.zip" -D previous
      - name: Upgrade in place; the vault must still decrypt
        shell: powershell
        run: |
          $base = Get-ChildItem previous\AgentFriday-Setup-*.zip | Select-Object -First 1
          $up = Get-ChildItem artifact\AgentFriday-Setup-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\rehearsal\upgrade-vault-test.ps1 `
            -BaseZip $base.FullName -UpgradeZip $up.FullName -Root "$env:RUNNER_TEMP\upgrade" -Label ci
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-evidence
          path: ${{ runner.temp }}/upgrade/RESULT.json
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fresh-install, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: artifact
      - name: Create a draft release (not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifact/* \
            --repo "${{ github.repository }}" --draft --verify-tag \
            --title "Agent Friday ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
