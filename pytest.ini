[pytest]
# Default `pytest` runs the full OFFLINE suite: ~1850 unit + API tests that need
# no live server, no network, and no API keys (the LLM layer is stubbed in
# tests/api/conftest.py). The Playwright UI tests in tests/test_friday_ui.py and
# tests/test_ui_audit.py drive a real browser against a running server on
# localhost:3000 — run those explicitly, e.g.
#   pytest tests/test_friday_ui.py
testpaths = tests
# PARALLEL BY DEFAULT, BY FILE.
#
# This suite took over an hour serially, which is why several defects in
# September survived: a gate nobody can afford to run is a gate that stops
# being run, and the nightly self-improvement loop's whole safety property is
# "nothing merges without a check that could have failed".
#
# Measured 2026-09-19 on a 16-core machine: ~100 min serial, ~21 min with
# `-n auto`. pytest-xdist was not installed; there was no parallelism at all.
#
# `--dist loadfile` rather than the default `load`: several modules keep
# state at module scope (tests/unit/test_run_chain.py is the clearest), and
# scattering one file's tests across workers made them fail for reasons that
# had nothing to do with the code. Keeping a file on one worker fixes that
# and costs almost nothing, because the suite is many files.
#
# `-n auto` takes every core. If you are running something else heavy, use
# `-n 4`; if you are debugging a single test, `-n 0` runs it in-process with
# clean tracebacks and real stdout ordering.
#
# Use `-n 0`, NOT `-p no:xdist`: unloading the plugin makes the `-n auto`
# below an unrecognised argument and pytest refuses to start. Written down
# because the first version of this comment said the wrong one.
addopts =
    -q
    -n auto
    --dist loadfile
    --ignore=tests/test_friday_ui.py
    --ignore=tests/test_ui_audit.py
    --ignore=tests/friday.spec.ts
markers =
    ui: browser/Playwright tests requiring a live server at localhost:3000
    network: needs live network and/or spends money; DESELECTED by default, run with --run-network
    live_residency: loads real multi-GB models and starts real processes; DESELECTED by default, run with --run-live-residency
    honesty: asks a live seat the golden honesty questions and judges the answers; DESELECTED by default, run with --run-honesty
    real_provider_paths: historical no-op — real provider paths are the default for every test since the D9 inversion; kept so existing files import cleanly
# Keep run output readable: these are known, non-failing warnings from product
# code and third-party libs (tracked separately), not test problems.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
