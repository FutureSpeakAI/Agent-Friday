<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="40%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="hg2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <!-- A straight line has a zero-height box, so a box-relative gradient
         paints nothing on it and a box-relative filter clips it away: the
         connector's gradient and the glow's region are in the icon's own
         coordinates instead. -->
    <linearGradient id="hg3" gradientUnits="userSpaceOnUse" x1="13" y1="0" x2="19" y2="0">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="5" width="9" height="7" rx="2" stroke="url(#hg)" stroke-width="1.3" filter="url(#gl)"/>
  <rect x="19" y="5" width="9" height="7" rx="2" stroke="url(#hg)" stroke-width="1.3" filter="url(#gl)"/>
  <rect x="11.5" y="20" width="9" height="7" rx="2" stroke="url(#hg)" stroke-width="1.3" filter="url(#gl)"/>
  <path d="M13 8.5 H19" stroke="url(#hg3)" stroke-width="1.2" stroke-linecap="round" filter="url(#gl)"/>
  <path d="M23.5 12 V16 H16 V19" stroke="url(#hg2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>
  <path d="M14.4 17.6 L16 19.4 L17.6 17.6" stroke="url(#hg2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
