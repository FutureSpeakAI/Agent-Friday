<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="mtg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="mtgl">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- A straight line has a zero-height box, so a box-relative gradient paints nothing on it:
         its gradient ("u") is in the icon's own coordinates. -->
    <linearGradient id="mtgu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>
  <rect x="12" y="4" width="8" height="14" rx="4" stroke="url(#mtg1)" stroke-width="1.2" filter="url(#mtgl)"/>
  <path d="M7 14 C7 20 11 23.5 16 23.5 C21 23.5 25 20 25 14" stroke="url(#mtg1)" stroke-width="1.2" stroke-linecap="round" filter="url(#mtgl)"/>
  <line x1="16" y1="23.5" x2="16" y2="28" stroke="url(#mtgu)" stroke-width="1"/>
  <line x1="11" y1="28" x2="21" y2="28" stroke="url(#mtgu)" stroke-width="1" opacity="0.7"/>
  <circle cx="26.5" cy="6.5" r="1.2" fill="#00d4ff" opacity="0.7"/>
</svg>
